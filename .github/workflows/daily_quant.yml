name: A Share AI Quant V4

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * 1-5"

jobs:
  quant:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant System
        run: |
          python quant_system.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: A-Share-Quant-Reports
          path: reports/
